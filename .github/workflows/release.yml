name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - id: version
        name: Verify package version matches tag
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const pkg = require("./package.json");
            const expected = process.argv[1];
            if (pkg.version !== expected) {
              console.error(`package.json version ${pkg.version} does not match tag ${expected}`);
              process.exit(1);
            }
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun x tsc --noEmit
      - run: bun run build

      - name: Pack npm artifact
        run: |
          mkdir -p .stage/release
          npm pack --pack-destination .stage/release

      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          node -e '
            const text = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const version = process.env.VERSION;
            const start = text.indexOf(`## ${version} `);
            if (start < 0) { console.error(`CHANGELOG.md has no section for ${version}`); process.exit(1); }
            const rest = text.slice(start).split("\n").slice(1).join("\n");
            const end = rest.search(/^## /m);
            require("fs").writeFileSync(".stage/release/NOTES.md", (end < 0 ? rest : rest.slice(0, end)).trim() + "\n");
          '

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: .stage/release/

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: .stage/release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .stage/release/NOTES.md
          files: .stage/release/*.tgz

  publish-npm:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: .stage/release

      - name: Publish to npm
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          if npm view "@sourcey/beautiful-mermaid@${VERSION}" version >/dev/null 2>&1; then
            echo "@sourcey/beautiful-mermaid@${VERSION} already exists on npm; skipping publish"
            exit 0
          fi
          npm publish ".stage/release/sourcey-beautiful-mermaid-${VERSION}.tgz" --provenance --access public
